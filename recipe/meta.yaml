{% set name = "pixcdust" %}
{% set version = "0.2.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pixcdust-{{ version }}.tar.gz
  sha256: d868d97e0557af16fa4aa700e81bac3062e92814d9946455b68e652b0bb3dc91

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=2.0.0,<3.0.0
    - scipy >=1.8.0
    - fiona >=1.9.5
    - pandas >=2.2.0
    - geopandas >=1.1.3
    - xdggs >=0.6.0, <1.0.0
    - h3-py >=3.7.6,<4.0.0
    - xarray >=2024.2.0,<2025.0.0
    - shapely >=2.0.3
    - click >=8.1.7
    - zarr >=2.11,<3.0
    - zcollection =2026.6.0
    - netcdf4 >=1.6.5
    - tqdm >=4.66.4
    - pyogrio >=0.8.0,<0.9.0
    - pyarrow >=16.1.0,<17.0.0
    - py-hydroweb >=1.2.0
    - eodag >=4.4.0,<5.0.0
    - folium >=0.16.0,<0.17.0
    - branca >=0.7.2,<0.8.0
    - xvec >=0.3.0,<0.4.0
    - astropy >=6.1.7,<6.2.0
    - astropy-healpix >=1.1.0, <1.2.0



test:
  imports:
    - pixcdust
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/SWOT-community/PixCDust
  summary: 'Tools and converters to facilitate local studies based on SWOT-HR Level-2 Pixel Cloud products.'
  license: Apache-2.0
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - gbfree
    - zawadzl
    - msimeon-cnes
