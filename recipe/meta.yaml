{% set name = "pixcdust" %}
{% set version = "0.3.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pixcdust-{{ version }}.tar.gz
  sha256: 2bfb58d336b4f23a7d82b2c8d8f4b8cdae7ea1c338b81b8b9cae2e370c33c98b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=2.0,<3.0
    - fiona >=1.9.5,<2.0.0
    - pandas >=2.2.0,<3.0.0
    - geopandas >=1.1.3,<2.0.0
    - h3 >=3.7.6,<4.0.0
    - astropy >=8.0.0,<9.0.0
    - astropy-healpix >=1.1.0,<2.0.0
    - xarray >=2025.3.0,<2026.7.0
    - shapely >=2.0.3,<3.0.0
    - click >=8.1.7,<9.0.0
    - zcollection >=2026.6.0,<2027.0.0
    - s3fs <=2025.12.0
    - netcdf4 >=1.6.5,<2.0.0
    - tqdm >=4.66.4,<5.0.0
    - pyogrio >=0.8.0,<0.9.0
    - pyarrow >=16.1.0,<17.0.0
    - py-hydroweb >=1.2.0,<2.0.0
    - folium >=0.16.0,<0.17.0
    - branca >=0.7.2,<0.8.0
    - xvec >=0.3.0,<0.4.0
    - eodag >=4.4.0,<5.0.0
    - xdggs >=0.6.0, <0.7.0
    - scipy >=1.18.0,<2.0.0
    - earthaccess>=0.19.0



test:
  imports:
    - pixcdust
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/SWOT-community/PixCDust
  summary: 'Tools and converters to facilitate local studies based on SWOT-HR Level-2 Pixel Cloud products.'
  license: Apache-2.0
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - gbfree
    - zawadzl
    - msimeon-cnes
